services:
  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      MONGO_URL: mongodb://mongo:27017
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "8001:8001"
    volumes:
      - ./backend:/app
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build: ./frontend
    env_file: ./frontend/.env
    environment:
      REACT_APP_BACKEND_URL: http://localhost:8001
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      HOST: 0.0.0.0
      BROWSER: none
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  mongo-data:
